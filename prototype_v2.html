// ─── HELPERS ───────────────────────────────────────────────────────────────────
const PRIORITY_TEXT = ['最重要','第二重要','第三重要','也在意','也在意'];
const WEIGHTS = [5,4,3,2,1];
const RANK_COLORS = [
  { bg:'#534AB7', fg:'#fff' },
  { bg:'#7F77DD', fg:'#fff' },
  { bg:'#AFA9EC', fg:'#fff' },
];

function calcScore(school, ordered) {
  return ordered.reduce((sum, key, i) => {
    const pr = school.pr[key];
    return sum + (pr !== null && pr !== undefined ? pr : 50) * (WEIGHTS[i] || 1);
  }, 0);
}

function getTier(pr) {
  if (pr === null || pr === undefined) return 0;
  if (pr >= 95) return 1; if (pr >= 85) return 2; if (pr >= 70) return 3;
  if (pr >= 40) return 4; return 5;
}

// v2: star count per tier (tier 0 = no data, no stars)
const TIER_STARS = [0, 5, 4, 3, 2, 1];

const TIER_LABEL = ['資料未收錄','頂尖','非常突出','突出','中上','中等'];
const TIER_VAR   = [
  { bg:'#f1efe8',color:'#888',border:'#ccc' },
  { bg:'var(--t1-bg)',color:'var(--t1-txt)',border:'var(--t1-bd)' },
  { bg:'var(--t2-bg)',color:'var(--t2-txt)',border:'var(--t2-bd)' },
  { bg:'var(--t3-bg)',color:'var(--t3-txt)',border:'var(--t3-bd)' },
  { bg:'var(--t4-bg)',color:'var(--t4-txt)',border:'var(--t4-bd)' },
  { bg:'var(--t5-bg)',color:'var(--t5-txt)',border:'var(--t5-bd)' },
];

function getPreviewResults(schoolIds, orderedInds) {
  const list = schoolIds.map(id => SCHOOLS.find(s => s.id === id)).filter(Boolean);
  const withData    = list.filter(s => s.hasBrand).sort((a,b) => calcScore(b, orderedInds) - calcScore(a, orderedInds));
  const withoutData = list.filter(s => !s.hasBrand);
  return [...withData, ...withoutData];
}

function getAutoIndicators(dirs) {
  const keys = new Set();
  dirs.forEach(d => {
    const dir = DIRECTIONS.find(x => x.id === d);
    if (dir) dir.inds.forEach(k => keys.add(k));
  });
  return [...keys];
}

// ─── BUCKET SCORING ────────────────────────────────────────────────────────────
const BUCKET_WEIGHTS = { best:50, second:30, ref:20 };

function calcScoreFromBuckets(school, buckets) {
  let score = 0;
  Object.entries(BUCKET_WEIGHTS).forEach(([bId, bW]) => {
    const keys = buckets[bId] || [];
    if (!keys.length) return;
    const perKey = bW / keys.length;
    keys.forEach(key => {
      const pr = school.pr[key];
      score += (pr != null ? pr : 50) * perKey;
    });
  });
  return score;
}

function getPreviewResultsByBuckets(schoolIds, buckets) {
  const list = schoolIds.map(id => SCHOOLS.find(s => s.id === id)).filter(Boolean);
  const withData    = list.filter(s => s.hasBrand)
    .sort((a, b) => calcScoreFromBuckets(b, buckets) - calcScoreFromBuckets(a, buckets));
  const withoutData = list.filter(s => !s.hasBrand);
  return [...withData, ...withoutData];
}

// ─── SMALL COMPONENTS ─────────────────────────────────────────────────────────
function ChanceBadge({ chance }) {
  const s = CHANCE_STYLE[chance];
  return <span className="chance-badge" style={{ background:s.bg, color:s.color }}>{CHANCE_LABEL[chance]}</span>;
}

function ChanceBar({ chance }) {
  const dots = CHANCE_STYLE[chance].dots;
  return (
    <div className="chance-bar">
      <ChanceBadge chance={chance} />
      {dots.map((c,i) => <span key={i} className="bar-dot" style={{ background:c }} />)}
    </div>
  );
}

function SeqCircle({ n, style }) {
  const col = n <= 3 ? RANK_COLORS[n-1] : { bg:'#eee', fg:'#888' };
  return (
    <div className="seq-circle" style={{ background:col.bg, color:col.fg, ...style }}>
      {n}
    </div>
  );
}

// v2: TierTag — uses star rating instead of text level label
function StarDisplay({ count, color }) {
  const filled = '★'.repeat(count);
  const empty  = '☆'.repeat(5 - count);
  return (
    <span className="tag-stars">
      {filled}
      {empty && <span className="star-empty">{empty}</span>}
    </span>
  );
}

function HalfStar() {
  return (
    <span style={{ display:'inline-block', overflow:'hidden', width:'0.55em', color:'#F5C518', lineHeight:1, verticalAlign:'middle' }}>★</span>
  );
}

function TierTag({ indKey, pr }) {
  const tier = getTier(pr);
  const ind = INDICATORS.find(x => x.key === indKey);
  const stars = TIER_STARS[tier];
  return (
    <span className="tier-tag">
      <span className="tag-label">{ind?.label}</span>
      <span className="tag-stars">
        {tier === 0
          ? <HalfStar />
          : <>
              {'★'.repeat(stars)}
              {5 - stars > 0 && <span className="star-empty">{'☆'.repeat(5 - stars)}</span>}
            </>
        }
      </span>
    </span>
  );
}

function ComboTab({ combo, wishlist, onOpenFlow, onAddSchool, onRemoveFromCombo, onRestoreOrder, onReorderCombo, onSyncToAll, actionsRef, initialPicking, defaultInds }) {
  const [picking, setPicking] = useState(!!initialPicking);
  const [pickSelected, setPickSelected] = useState([]);
  const [showIndInfo, setShowIndInfo] = useState(false);
  const [removeTarget, setRemoveTarget] = useState(null);

  if (actionsRef) {
    actionsRef.current = {
      openPicker: () => { setPickSelected([]); setPicking(true); },
    };
  }
  const [localOrder, setLocalOrder] = useState(null);
  const [dragIdx, setDragIdx] = useState(null);
  const [dragOver, setDragOver] = useState(null);

  const available = wishlist.filter(id => !combo.schools.includes(id));
  const rec = combo.recommendedOrder || [];
  const isDrifted = rec.length > 0 && JSON.stringify(combo.schools) !== JSON.stringify(rec);
  const appliedInds = (combo.appliedInds && combo.appliedInds.length > 0) ? combo.appliedInds : (defaultInds || []);

  const rawIds = localOrder || combo.schools;
  // 無品牌力資料的校系固定排在最下方
  const hasBrandIds    = rawIds.filter(id => SCHOOLS.find(s => s.id === id)?.hasBrand);
  const nonHasBrandIds = rawIds.filter(id => !SCHOOLS.find(s => s.id === id)?.hasBrand);
  const sortedIds = [...hasBrandIds, ...nonHasBrandIds];
  const schools = sortedIds.map(id => SCHOOLS.find(s => s.id === id)).filter(Boolean);
  const hasBrandCount = hasBrandIds.length;

  function handleDragStart(e, idx) {
    setLocalOrder([...sortedIds]);
    setDragIdx(idx);
    e.dataTransfer.effectAllowed = 'move';
  }

  function handleDragOver(e, idx) {
    e.preventDefault();
    setDragOver(idx);
    // 僅允許在有品牌力資料的校系間拖拉
    if (dragIdx === null || dragIdx === idx || idx >= hasBrandCount || dragIdx >= hasBrandCount) return;
    setLocalOrder(prev => {
      const cur = prev || sortedIds;
      const arr = [...cur];
      const [removed] = arr.splice(dragIdx, 1);
      arr.splice(idx, 0, removed);
      return arr;
    });
    setDragIdx(idx);
  }

  function handleDragEnd() {
    if (localOrder) onReorderCombo(combo.id, localOrder);
    setLocalOrder(null);
    setDragIdx(null);
    setDragOver(null);
  }

  return (
    <>
      {/* Entry card — only shown before first recommendation applied */}
      {appliedInds.length === 0 && (
        <div className="combo-entry-card" onClick={() => onOpenFlow('apply', combo.id)}>
          <div className="combo-entry-icon">
            <i className="ti ti-sparkles" style={{ color:'var(--ai-mid)', fontSize:20 }} />
          </div>
          <div className="combo-entry-text" style={{ flex:1 }}>
            <h4>調整排序條件</h4>
            <p>用我在意的學校條件，自動排出適合我的志願順序</p>
          </div>
          <i className="ti ti-chevron-right" style={{ color:'var(--ai-mid)', fontSize:18 }} />
        </div>
      )}

      {/* CTA button — shown after recommendation applied */}
      {appliedInds.length > 0 && (
        <div style={{ padding:'4px 16px 0' }}>
          <button onClick={() => onOpenFlow('apply', combo.id)}
            style={{ display:'flex', alignItems:'center', gap:5, background:'var(--ai-mid)', color:'#fff', border:'none',
              borderRadius:20, padding:'7px 14px', fontSize:12, fontWeight:600, cursor:'pointer' }}>
            <i className="ti ti-sparkles" style={{ fontSize:13 }} />
            調整排序條件
          </button>
        </div>
      )}

      {schools.length === 0 ? (
        <div className="empty-state" style={{ padding:'24px' }}>
          <i className="ti ti-playlist-x" />
          <h3>此組合還沒有志願</h3>
          <p>從全部志願新增，或刪除此組合</p>
        </div>
      ) : (
        <>
          {/* Info text — below CTA, above list */}
          {appliedInds.length > 0 && (
            <div style={{ padding:'10px 16px 4px' }}>
              <div style={{ fontSize:12, color:'#aaa', lineHeight:1.55, marginBottom:4 }}>
                已用你在意的條件幫你排序，請再自行考量錄取機會與就讀意願，拖拉調整排序。
              </div>
              <button onClick={() => setShowIndInfo(true)}
                style={{ background:'none', border:'none', color:'#bbb', fontSize:11, cursor:'pointer', padding:0, textDecoration:'underline', display:'flex', alignItems:'center', gap:3 }}>
                排序依據 <i className="ti ti-help-circle" style={{ fontSize:12 }} />
              </button>
            </div>
          )}
          {schools.map((s,i) => (
            <WishlistCard key={s.id} school={s}
              index={s.hasBrand ? i : null}
              showRemove
              appliedInds={appliedInds}
              onRemove={() => setRemoveTarget(s)}
              dragHandlers={s.hasBrand ? {
                draggable: true,
                onDragStart: e => handleDragStart(e, i),
                onDragOver:  e => handleDragOver(e, i),
                onDragEnd:   handleDragEnd,
                isDragging:  dragIdx === i,
                isDragOver:  dragOver === i && dragIdx !== i,
              } : {}} />
          ))}
        </>
      )}

      <div style={{ height:80 }} />

      {picking && (
        <>
          <div className="overlay" onClick={() => setPicking(false)} />
          <div className="bottom-sheet">
            <div className="sheet-handle" />
            <div className="sheet-header" style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
              <div>
                <div className="sheet-title">選擇要新增的志願</div>
                <div className="sheet-subtitle">
                  {available.length === 0 ? '全部志願已在此組合中' : `可從 ${available.length} 個志願中選擇，已選 ${pickSelected.length} 個`}
                </div>
              </div>
              <button className="btn-ghost" onClick={() => setPicking(false)} style={{ fontSize:20, color:'#aaa', padding:0 }}>
                <i className="ti ti-x" />
              </button>
            </div>
            <div className="sheet-body" style={{ paddingTop:8 }}>
              {available.length === 0 ? (
                <div style={{ textAlign:'center', padding:'24px 0', color:'#aaa', fontSize:13 }}>全部志願已在此組合中</div>
              ) : (
                available.map(id => {
                  const s = SCHOOLS.find(x => x.id === id);
                  if (!s) return null;
                  const sel = pickSelected.includes(id);
                  return (
                    <div key={id}
                      onClick={() => setPickSelected(prev => sel ? prev.filter(x => x !== id) : [...prev, id])}
                      style={{
                        display:'flex', alignItems:'center', gap:12,
                        padding:'11px 4px', borderBottom:'1px solid #f5f5f5',
                        cursor:'pointer', transition:'background .1s',
                      }}>
                      <div style={{
                        width:20, height:20, borderRadius:5, flexShrink:0,
                        border:`2px solid ${sel ? 'var(--ai-mid)' : '#ccc'}`,
                        background: sel ? 'var(--ai-mid)' : '#fff',
                        display:'flex', alignItems:'center', justifyContent:'center',
                        transition:'all .15s',
                      }}>
                        {sel && <i className="ti ti-check" style={{ fontSize:11, color:'#fff' }} />}
                      </div>
                      <div style={{ flex:1 }}>
                        <div style={{ fontSize:13, fontWeight:600, color:'#222' }}>{s.name}</div>
                        <div style={{ fontSize:12, color:'var(--brand)', marginTop:1 }}>{s.dept}</div>
                        <div style={{ fontSize:11, color:'#999', marginTop:1 }}>
                          <ChanceBadge chance={s.chance} />
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
            <div className="sheet-footer" style={{ display:'flex', gap:10 }}>
              <button className="btn-outline" style={{ flex:1 }} onClick={() => setPicking(false)}>取消</button>
              <button className="btn-primary"
                style={{ flex:2, justifyContent:'center', opacity: pickSelected.length === 0 ? 0.45 : 1 }}
                disabled={pickSelected.length === 0}
                onClick={() => {
                  pickSelected.forEach(id => onAddSchool(combo.id, id));
                  setPickSelected([]);
                  setPicking(false);
                }}>
                加入 {pickSelected.length > 0 ? `${pickSelected.length} 個` : ''}志願
              </button>
            </div>
          </div>
        </>
      )}

      {showIndInfo && <IndicatorInfoSheet onClose={() => setShowIndInfo(false)} />}

      {removeTarget && (
        <div className="confirm-modal-overlay" onClick={() => setRemoveTarget(null)}>
          <div className="confirm-modal" onClick={e => e.stopPropagation()}>
            <h3>從組合移除？</h3>
            <p>「{removeTarget.name} {removeTarget.dept}」將從「{combo.name}」中移除，全部志願清單不受影響。</p>
            <div style={{ display:'flex', gap:10 }}>
              <button className="btn-outline" style={{ flex:1 }} onClick={() => setRemoveTarget(null)}>取消</button>
              <button className="btn-primary" style={{ flex:1, background:'#C0392B', justifyContent:'center' }}
                onClick={() => { onRemoveFromCombo(combo.id, removeTarget.id); setRemoveTarget(null); }}>
                確認移除
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// ─── RECOMMEND FLOW ────────────────────────────────────────────────────────────
function RecommendFlow({ mode, comboId, targetComboSchools, onClose, onApply }) {
  const [step, setStep]   = useState(1);
  const [inds, setInds]   = useState([]);
  const [dragIdx, setDragIdx] = useState(null);
  const [results, setResults] = useState([]);

  const demoSchools = SCHOOLS.slice(0,5).map(s => s.id);
  const sourceSchools = (mode === 'demo') ? demoSchools : (mode === 'all' ? [] : (targetComboSchools || demoSchools));

  const hasSameSchoolDiffCluster = (() => {
    const groups = {};
    sourceSchools.forEach(id => {
      const s = SCHOOLS.find(x => x.id === id);
      if (!s) return;
      if (!groups[s.name]) groups[s.name] = new Set();
      groups[s.name].add(s.cluster);
    });
    return Object.values(groups).some(set => set.size > 1);
  })();

  function toggleInd(key) {
    setInds(prev => {
      if (prev.includes(key)) return prev.filter(x => x !== key);
      if (prev.length >= 5) return prev;
      return [...prev, key];
    });
  }

  function handleIndDragStart(e, idx) {
    e.dataTransfer.setData('text/plain', String(idx));
    e.dataTransfer.effectAllowed = 'move';
    setDragIdx(idx);
  }

  function handleIndDragOver(e, idx) {
    e.preventDefault();
    if (dragIdx === null || dragIdx === idx) return;
    setInds(prev => {
      const arr = [...prev];
      const [removed] = arr.splice(dragIdx, 1);
      arr.splice(idx, 0, removed);
      return arr;
    });
    setDragIdx(idx);
  }

  function handleIndDragEnd() { setDragIdx(null); }

  function generateResults() {
    if (mode === 'all') {
      onApply([], [...inds], null);
      onClose();
      return;
    }
    const list = sourceSchools.map(id => SCHOOLS.find(s => s.id === id)).filter(Boolean);
    const withData = list.filter(s => s.hasBrand).sort((a, b) => calcScore(b, inds) - calcScore(a, inds));
    const withoutData = list.filter(s => !s.hasBrand);
    const sorted = [...withData, ...withoutData];
    if (mode === 'demo') {
      setResults(sorted);
      setStep('preview');
    } else {
      onApply(sorted.map(s => s.id), [...inds], comboId);
      onClose();
    }
  }

  const selectedInds  = inds.map(key => INDICATORS.find(x => x.key === key)).filter(Boolean);
  const availableInds = INDICATORS.filter(x => !inds.includes(x.key));

  return (
    <>
      <div className="overlay" onClick={onClose} />
      <div className="bottom-sheet">
        <div className="sheet-handle" />

        {step === 1 && (
          <>
            <div className="sheet-header">
              <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:10 }}>
                <div className="sheet-subtitle" style={{ fontSize:13, color:'#555', lineHeight:1.65, marginTop:2, flex:1 }}>
                  按照你在意的學校條件，依重視程度選出推薦的指標（最多 5 個）
                </div>
                <button className="btn-ghost" onClick={onClose} style={{ fontSize:20, color:'#aaa', padding:0, flexShrink:0 }}>
                  <i className="ti ti-x" />
                </button>
              </div>
            </div>
            <div className="sheet-body">

              {/* 已選指標區：可拖拉排序 */}
              {selectedInds.length > 0 && (
                <div style={{ marginBottom:12 }}>
                  <div style={{ fontSize:11, color:'#aaa', padding:'4px 0 8px', display:'flex', alignItems:'center', gap:5 }}>
                    已選 {inds.length} / 5
                    {inds.length > 1 && <span>・拖拉調整重要性 <i className="ti ti-arrows-move" style={{ fontSize:12 }} /></span>}
                  </div>
                  {selectedInds.map((ind, i) => {
                    const isDragging = dragIdx === i;
                    const numBg = i === 0 ? RANK_COLORS[0].bg : i === 1 ? RANK_COLORS[1].bg : i === 2 ? RANK_COLORS[2].bg : '#eee';
                    const numFg = i === 0 ? RANK_COLORS[0].fg : i === 1 ? RANK_COLORS[1].fg : i === 2 ? RANK_COLORS[2].fg : '#888';
                    return (
                      <div key={ind.key}
                        draggable
                        onDragStart={e => handleIndDragStart(e, i)}
                        onDragOver={e => handleIndDragOver(e, i)}
                        onDragEnd={handleIndDragEnd}
                        style={{
                          display:'flex', alignItems:'center', gap:10,
                          padding:'10px 12px', borderRadius:12, marginBottom:7,
                          border:'1.5px solid var(--ai-border)', background:'var(--ai-bg)',
                          cursor:'grab', userSelect:'none',
                          opacity: isDragging ? 0.4 : 1,
                        }}>
                        <div style={{ width:24, height:24, borderRadius:'50%', flexShrink:0,
                          background:numBg, color:numFg,
                          display:'flex', alignItems:'center', justifyContent:'center',
                          fontSize:12, fontWeight:800 }}>
                          {i + 1}
                        </div>
                        <div style={{ width:30, height:30, borderRadius:8, background:ind.bg,
                          display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                          <i className={`ti ${ind.icon}`} style={{ color:ind.ic, fontSize:15 }} />
                        </div>
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontSize:13, fontWeight:700, color:'#222' }}>
                            {ind.label}
                            {(ind.key === 'salary' || ind.key === 'hire') && (
                              <span style={{ fontSize:10, fontWeight:600, color:'#854F0B', background:'#FAEEDA', border:'0.5px solid #EF9F27', padding:'1px 6px', borderRadius:20, marginLeft:4, whiteSpace:'nowrap' }}>
                                比較同校不同系的差異
                              </span>
                            )}
                          </div>
                        </div>
                        <i className="ti ti-grip-horizontal" style={{ color:'#ccc', fontSize:15, flexShrink:0 }} />
                        <button onClick={e => { e.stopPropagation(); toggleInd(ind.key); }}
                          style={{ background:'none', border:'none', cursor:'pointer', color:'#ccc', fontSize:16, padding:0, flexShrink:0, display:'flex', alignItems:'center' }}>
                          <i className="ti ti-x" />
                        </button>
                      </div>
                    );
                  })}
                  {inds.length < 5 && (
                    <div style={{ fontSize:11, color:'#ccc', paddingLeft:2, marginBottom:8 }}>
                      還可再選 {5 - inds.length} 個
                    </div>
                  )}
                </div>
              )}

              {/* 可選指標區 */}
              {availableInds.length > 0 && (
                <>
                  {inds.length === 0 && (
                    <div style={{ fontSize:11, color:'#aaa', padding:'4px 0 8px' }}>已選 0 / 5</div>
                  )}
                  {availableInds.map(ind => {
                    const dis = inds.length >= 5;
                    return (
                      <div key={ind.key}
                        className={`ind-card ${dis ? 'disabled-card' : ''}`}
                        onClick={() => !dis && toggleInd(ind.key)}>
                        <div className="ind-icon" style={{ background:ind.bg }}>
                          <i className={`ti ${ind.icon}`} style={{ color:ind.ic }} />
                        </div>
                        <div className="ind-text">
                          <div className="ind-name">
                            {ind.label}
                            {(ind.key === 'salary' || ind.key === 'hire') && (
                              <span style={{ fontSize:10, fontWeight:600, color:'#854F0B', background:'#FAEEDA', border:'0.5px solid #EF9F27', padding:'1px 6px', borderRadius:20, marginLeft:4, whiteSpace:'nowrap' }}>
                                比較同校不同系的差異
                              </span>
                            )}
                          </div>
                          <div className="ind-desc">{ind.desc}</div>
                        </div>
                        <div className="check-circle" />
                      </div>
                    );
                  })}
                </>
              )}
              {availableInds.length === 0 && (
                <div style={{ textAlign:'center', fontSize:11, color:'#aaa', padding:'10px 0 4px' }}>
                  已選滿 5 個，拖拉上方指標調整重要性
                </div>
              )}
            </div>
            <div className="sheet-footer">
              <button className="btn-primary"
                style={{ width:'100%', justifyContent:'center', opacity: inds.length < 1 ? 0.5 : 1 }}
                disabled={inds.length < 1}
                onClick={generateResults}>
                確認，開始推薦
              </button>
            </div>
          </>
        )}

        {step === 'preview' && (
          <>
            <div className="sheet-header">
              <div style={{ display:'flex', alignItems:'center', marginBottom:4 }}>
                <button className="back-btn" onClick={() => setStep(1)}>
                  <i className="ti ti-arrow-left" /> 上一步
                </button>
              </div>
              <div className="sheet-title">推薦志願排序</div>
              <div className="sheet-subtitle" style={{ marginTop:4, lineHeight:1.6 }}>
                {inds.map((k, i) => `${i+1}. ${INDICATORS.find(x=>x.key===k)?.label}`).join('　')}
              </div>
            </div>
            <div className="sheet-body">
              <div style={{ background:'var(--ai-bg)', border:'0.5px solid var(--ai-border)', borderRadius:10, padding:'12px 14px', marginBottom:14, display:'flex', gap:10, alignItems:'flex-start' }}>
                <i className="ti ti-sparkles" style={{ color:'var(--ai-mid)', fontSize:15, flexShrink:0, marginTop:1 }} />
                <span style={{ fontSize:12, color:'var(--ai-dark)', lineHeight:1.65 }}>
                  以下為落點結果前 5 個志願的示範排序。<b>登入後</b>可依你加入的全部志願，產生專屬推薦順序。
                </span>
              </div>
              {results.map((s, i) => {
                const rank = s.hasBrand ? (results.filter(x => x.hasBrand).indexOf(s) + 1) : null;
                const rankColor = rank && rank <= 3 ? RANK_COLORS[rank-1] : { bg:'#eee', fg:'#888' };
                return (
                  <div key={s.id} className={`preview-card ${!s.hasBrand ? 'no-data' : ''}`}>
                    <div className="preview-card-top">
                      <div className="seq-circle" style={{ background: s.hasBrand ? rankColor.bg : '#B4B2A9', color: s.hasBrand ? rankColor.fg : '#fff', width:24, height:24, borderRadius:'50%', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, fontWeight:700 }}>
                        {s.hasBrand ? rank : '—'}
                      </div>
                      <div style={{ flex:1 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:6, flexWrap:'wrap' }}>
                          <span style={{ fontSize:14, fontWeight:700 }}>{s.name}</span>
                          <ChanceBadge chance={s.chance} />
                        </div>
                        <div style={{ fontSize:13, color:'var(--brand)', fontWeight:500 }}>{s.dept}</div>
                        <div style={{ fontSize:12, color:'#999', marginTop:2 }}>錄取機率 {s.rate}%</div>
                      </div>
                    </div>
                    {s.hasBrand ? (
                      <div className="tier-tags">
                        {inds.map(key => <TierTag key={key} indKey={key} pr={s.pr[key]} />)}
                      </div>
                    ) : (
                      <div className="no-data-warn">
                        <i className="ti ti-alert-circle" /> 此校系尚無相關指標的資料，不列入指標排序，建議另行參考學校官方資訊。
                      </div>
                    )}
                  </div>
                );
              })}
              <div style={{ textAlign:'center', fontSize:12, color:'#aaa', padding:'8px 0 4px' }}>
                此排序僅供參考
              </div>
            </div>
            <div className="sheet-footer">
              <button className="btn-primary" style={{ width:'100%', justifyContent:'center', marginBottom:10 }}
                onClick={onClose}>
                登入，排序我的志願
              </button>
              <button className="btn-outline" style={{ width:'100%' }} onClick={onClose}>先不用</button>
            </div>
          </>
        )}

      </div>
    </>
  );
}

// ─── WISHLIST PAGE ─────────────────────────────────────────────────────────────
function WishlistPage({ wishlist, combos, onBack, onOpenFlow, onCreateCombo, onAddToCombo, onRemoveFromCombo, onRestoreOrder, onReorderCombo, onSyncToAll }) {
  const [activeTab, setActiveTab] = useState('all');
  const [namingMode, setNamingMode] = useState(false);
  const [pendingName, setPendingName] = useState('');
  const [autoPickComboId, setAutoPickComboId] = useState(null);
  const comboActionsRef = useRef(null);
  const [allInds, setAllInds] = useState([]);
  const [showAllIndsFlow, setShowAllIndsFlow] = useState(true);

  const activeCombo = combos.find(c => c.id === activeTab);

  function handleRequestNewCombo() {
    setPendingName('');
    setNamingMode(true);
  }

  function handleConfirmName() {
    if (!pendingName.trim()) return;
    const id = `c${Date.now()}`;
    onCreateCombo(id, pendingName.trim());
    setActiveTab(id);
    setAutoPickComboId(id);
    setNamingMode(false);
    setPendingName('');
  }

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh' }}>
      {/* Header */}
      <div style={{ background:'#fff', borderBottom:'1px solid #eee', padding:'0 16px', height:52, display:'flex', alignItems:'center', gap:12, flexShrink:0, position:'sticky', top:0, zIndex:100 }}>
        <button className="btn-ghost" onClick={onBack}>
          <i className="ti ti-arrow-left" style={{ fontSize:18 }} />
        </button>
        <span style={{ fontSize:16, fontWeight:700, flex:1 }}>排志願</span>
        <span style={{ background:'#f0f0f0', color:'#555', fontSize:12, fontWeight:600, padding:'3px 10px', borderRadius:20 }}>
          {wishlist.length} 個志願
        </span>
      </div>

      {/* Tab bar */}
      <div className="tab-bar" style={{ flexShrink:0 }}>
        <div className={`tab-item ${activeTab==='all'?'active':''}`} onClick={() => setActiveTab('all')}>全部</div>
        {combos.map(c => (
          <div key={c.id} className={`tab-item ${activeTab===c.id?'active':''}`} onClick={() => setActiveTab(c.id)}>
            {c.name}
          </div>
        ))}
        {combos.length < 10 && (
          <div className="tab-item" onClick={handleRequestNewCombo} style={{ color:'#999' }}>
            <i className="ti ti-plus" />
          </div>
        )}
      </div>

      {/* Content */}
      <div style={{ flex:1, overflowY:'auto', paddingTop:8 }}>
        {activeTab === 'all' ? (
          <AllTab wishlist={wishlist} onCreateCombo={handleRequestNewCombo} allInds={allInds} onGoResults={onBack} />
        ) : activeCombo ? (
          <ComboTab
            key={activeCombo.id}
            combo={activeCombo}
            wishlist={wishlist}
            onOpenFlow={onOpenFlow}
            onAddSchool={onAddToCombo}
            onRemoveFromCombo={onRemoveFromCombo}
            onRestoreOrder={onRestoreOrder}
            onReorderCombo={onReorderCombo}
            onSyncToAll={onSyncToAll}
            actionsRef={comboActionsRef}
            initialPicking={autoPickComboId === activeCombo?.id}
            defaultInds={allInds}
          />
        ) : null}
      </div>

      {/* Bottom action bar */}
      {activeTab === 'all' ? (
        <div style={{ padding:'12px 16px 28px', borderTop:'1px solid #eee', background:'#fff', flexShrink:0 }}>
          <button className="btn-primary" style={{ width:'100%', justifyContent:'center' }} onClick={onBack}>
            <i className="ti ti-arrow-left" style={{ fontSize:15 }} />
            返回列表
          </button>
        </div>
      ) : activeCombo ? (
        <div style={{ padding:'12px 16px 28px', borderTop:'1px solid #eee', background:'#fff', flexShrink:0, display:'flex', gap:10 }}>
          <button className="btn-outline" style={{ flex:1 }}
            onClick={() => comboActionsRef.current?.openPicker()}>
            新增志願
          </button>
          <button className="btn-primary" style={{ flex:1, justifyContent:'center' }}
            onClick={() => onOpenFlow('apply', activeCombo.id)}>
            <i className="ti ti-sparkles" style={{ fontSize:14 }} />
            調整排序條件
          </button>
        </div>
      ) : null}

      {/* Auto-trigger allInds flow on first visit to AllTab */}
      {activeTab === 'all' && allInds.length === 0 && showAllIndsFlow && (
        <RecommendFlow
          mode="all"
          onClose={() => setShowAllIndsFlow(false)}
          onApply={(_, inds) => { setAllInds(inds); setShowAllIndsFlow(false); }}
        />
      )}

      {/* Naming modal */}
      {namingMode && (
        <>
          <div className="overlay" onClick={() => setNamingMode(false)} />
          <div className="bottom-sheet">
            <div className="sheet-handle" />
            <div style={{ padding:'20px 20px 32px' }}>
              <div style={{ fontSize:16, fontWeight:700, marginBottom:6 }}>幫這個組合命名</div>
              <div style={{ fontSize:12, color:'#999', marginBottom:16 }}>命名後會自動引導你加入志願</div>
              <input
                type="text"
                value={pendingName}
                onChange={e => setPendingName(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleConfirmName()}
                placeholder="例如：衝刺志願、穩健保底…"
                autoFocus
                style={{ width:'100%', padding:'12px 14px', borderRadius:10, border:'1.5px solid #ddd', fontSize:14, outline:'none', marginBottom:16, fontFamily:'inherit' }}
              />
              <div style={{ display:'flex', gap:10 }}>
                <button className="btn-outline" style={{ flex:1 }} onClick={() => setNamingMode(false)}>取消</button>
                <button className="btn-primary"
                  style={{ flex:1, justifyContent:'center', opacity: pendingName.trim() ? 1 : 0.5 }}
                  disabled={!pendingName.trim()}
                  onClick={handleConfirmName}>
                  建立並加入志願
                </button>
              </div>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// ─── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage]           = useState('results');
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [wishlist, setWishlist]   = useState(['ntu-law','ntu-bio','ncku-tr','ntu-cs','nccu-nw','ntust-im']);
  const [combos, setCombos]       = useState([{
    id:'c1', name:'組合一',
    schools:['ntu-law','ntu-bio','ncku-tr','ntu-cs','fju-soc','ntust-im'],
    // 預先套用三個指標，方便直接看到星等 + 部分無資料的呈現狀態
    appliedInds:['job','fame','hire'],
    recommendedOrder:['ntu-law','ntu-bio','ncku-tr','ntu-cs','fju-soc','ntust-im'],
  }]);
  const [flow, setFlow]           = useState(null);

  function toggleWish(id, action) {
    if (action === 'add') setWishlist(prev => [...prev, id]);
    else {
      setWishlist(prev => prev.filter(x => x !== id));
      setCombos(prev => prev.map(c => ({ ...c, schools: c.schools.filter(x => x !== id) })));
    }
  }

  function createCombo(id, name) {
    setCombos(prev => [...prev, { id, name, schools: [], appliedInds: [], recommendedOrder: [] }]);
  }

  function addToCombo(comboId, schoolId) {
    setCombos(prev => prev.map(c => c.id === comboId ? { ...c, schools: [...c.schools, schoolId] } : c));
  }

  function removeFromCombo(comboId, schoolId) {
    setCombos(prev => prev.map(c => c.id === comboId ? { ...c, schools: c.schools.filter(x => x !== schoolId) } : c));
  }

  function applySort(orderedIds, orderedInds, comboId) {
    if (comboId) {
      setCombos(prev => prev.map(c => c.id === comboId
        ? { ...c, schools: orderedIds, appliedInds: orderedInds, recommendedOrder: orderedIds }
        : c));
    }
    setFlow(null);
  }

  function restoreOrder(comboId) {
    setCombos(prev => prev.map(c => c.id === comboId
      ? { ...c, schools: [...c.recommendedOrder] }
      : c));
  }

  function reorderCombo(comboId, newSchools) {
    setCombos(prev => prev.map(c => c.id === comboId
      ? { ...c, schools: newSchools }
      : c));
  }

  function applyComboOrderToAll(comboId) {
    const combo = combos.find(c => c.id === comboId);
    if (!combo || combo.schools.length === 0) return;
    setWishlist(prev => {
      const result = [...prev];
      const slots = prev
        .map((id, i) => ({ id, i }))
        .filter(({ id }) => combo.schools.includes(id))
        .map(({ i }) => i)
        .sort((a, b) => a - b);
      const ordered = combo.schools.filter(id => prev.includes(id));
      slots.forEach((slotIdx, n) => { result[slotIdx] = ordered[n]; });
      return result;
    });
  }

  const targetCombo = flow ? combos.find(c => c.id === flow.comboId) : null;

  return (
    <div className="app-shell">
      {page === 'results' && (
        <>
          <div className="navbar">
            <div className="navbar-logo">
              <em>104</em> <span>落點分析</span>
            </div>
            <div className="demo-toggle">
              <button className={!isLoggedIn ? 'on' : ''} onClick={() => setIsLoggedIn(false)}>未登入</button>
              <button className={isLoggedIn ? 'on' : ''} onClick={() => setIsLoggedIn(true)}>已登入</button>
            </div>
          </div>
          <ResultsPage
            wishlist={wishlist}
            onToggleWish={toggleWish}
            onOpenFlow={(mode, comboId) => setFlow({ mode, comboId })}
            onGoWishlist={() => setPage('wishlist')}
            isLoggedIn={isLoggedIn}
          />
        </>
      )}

      {page === 'wishlist' && (
        <WishlistPage
          wishlist={wishlist}
          combos={combos}
          onBack={() => setPage('results')}
          onOpenFlow={(mode, comboId) => setFlow({ mode, comboId })}
          onCreateCombo={createCombo}
          onAddToCombo={addToCombo}
          onRemoveFromCombo={removeFromCombo}
          onRestoreOrder={restoreOrder}
          onReorderCombo={reorderCombo}
          onSyncToAll={applyComboOrderToAll}
        />
      )}

      {flow && (
        <RecommendFlow
          mode={flow.mode}
          comboId={flow.comboId}
          targetComboSchools={targetCombo?.schools}
          onClose={() => setFlow(null)}
          onApply={applySort}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
